name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Real Stripe/Resend/Sentry/storage keys aren't needed to build —
        # every integration lazy-inits and only errors if actually called
        # at runtime. DATABASE_URL is required by Prisma's generator step
        # even though no query runs at build time.
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
          NEXTAUTH_SECRET: "ci-placeholder-secret"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build
